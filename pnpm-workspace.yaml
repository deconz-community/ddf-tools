
packages:
  - packages/*
  - packages/store/packages/*
  - "!**/.vscode-text-web/**"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5

ignoredBuiltDependencies:
  - braintrust

onlyBuiltDependencies:
  - protobufjs
  - sqlite3
  - "@playwright/browser-chromium"
  - argon2
  - esbuild
  - isolated-vm
  - oracledb
  - sharp
  - vue-demi
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@directus/license@0.6.1"
  - chokidar@4.0.3
  - jose@4.15.9
  - semver@6.3.1
