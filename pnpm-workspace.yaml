
packages:
  - apps/*
  - packages/*
  - packages/store/packages/*
  - "!**/.vscode-text-web/**"
allowBuilds:
  '@playwright/browser-chromium': true
  argon2: true
  braintrust: true
  esbuild: true
  isolated-vm: true
  oracledb: true
  protobufjs: true
  sharp: true
  sqlite3: true
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5

minimumReleaseAgeExclude:
  - "@smithy/core@3.36.1"
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - degit@3.10.1
  - turbo@2.11.10
  - immer@11.2.6
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@directus/license@0.6.1"
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  - chokidar@4.0.3
  - jose@4.15.9
  - semver@6.3.1
